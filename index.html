<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vending Tracker</title>
<style>
:root{
  --bg:#0d1017; --panel:#161a24; --panel2:#1b2030; --border:#2a3142;
  --text:#e7e9ee; --dim:#97a0b4; --accent:#66c7ff;
  --good:#6ee7a8; --bad:#ff7f7f; --warn:#ffb86b;
  --pkm:#ffd34d; --rift:#c78cff; --op:#ff8f6b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:60px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 10px}
header h1{font-size:20px;margin:0}
header h1 .accent{color:var(--accent)}
.spacer{flex:1}
.chip{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--dim);background:var(--panel)}
.chip.ok{color:var(--good);border-color:#2c5a44}
.chip.err{color:var(--bad);border-color:#6a3232;cursor:pointer}
.chip.busy{color:var(--warn)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:7px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:#123145;border-color:#1d5f8a;color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.small{padding:3px 9px;font-size:12.5px;border-radius:6px}
.tabs{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.tabs button{border-radius:8px 8px 0 0;border-bottom:2px solid transparent;background:transparent;border-color:transparent;color:var(--dim);padding:7px 14px}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{min-width:120px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled{border-style:dashed;color:var(--accent)}
.filters input,.filters select{width:auto}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ig .wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--dim);font-weight:600;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid #202636;vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.good{color:var(--good)} .bad{color:var(--bad)} .accent{color:var(--accent)} .dim{color:var(--dim)}
.gchip{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px;color:#0d1017}
.g-pokemon{background:var(--pkm)} .g-riftbound{background:var(--rift)} .g-onepiece{background:var(--op)} .g-other{background:var(--dim)}
.pname{font-weight:600}
.sub{font-size:12px;color:var(--dim)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:999px;padding:0 7px;margin:2px 4px 0 0;color:var(--accent);background:var(--panel2);cursor:pointer}
.tag:hover{border-color:var(--accent)}
.actions{white-space:nowrap;text-align:right}
.actions button{margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--dim);margin-top:2px}
.subh{font-size:13px;font-weight:700;color:var(--accent);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.subh:first-child{margin-top:0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:420px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px;font-size:16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid .wide{grid-column:1/-1}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.empty{color:var(--dim);text-align:center;padding:26px 0}
.formbar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#setup{max-width:460px;margin:60px auto}
#setup p{color:var(--dim);font-size:13.5px}
.tblwrap{overflow-x:auto}
footer{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer .note{font-size:12px;color:var(--dim)}
@media (max-width:700px){
  .hidemob{display:none}
  td,th{padding:6px 5px}
  body{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vending <span class="accent">Tracker</span></h1>
    <div class="spacer"></div>
    <span id="syncchip" class="chip">not connected</span>
    <button class="small" onclick="openSettings()">⚙︎ Settings</button>
  </header>

  <!-- first-run / settings -->
  <div id="setup" class="panel" style="display:none">
    <h3 style="margin-top:0">Connect to your data</h3>
    <p>The tracker keeps all data on your own Cloudflare Worker. Enter its URL and your secret token once per device; they stay in this browser.</p>
    <div style="display:grid;gap:10px">
      <div><label>API URL</label><input id="cfg_api" value="https://vending-tracker-api.shizukaziye.workers.dev"></div>
      <div><label>Access token</label><input id="cfg_token" type="password" placeholder="your secret token"></div>
    </div>
    <div class="formbar">
      <button class="primary" onclick="saveSettings()">Connect</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="tabs">
      <button id="tab_inv" class="active" onclick="setTab('inv')">Inventory</button>
      <button id="tab_sales" onclick="setTab('sales')">Sales</button>
      <button id="tab_stats" onclick="setTab('stats')">Stats</button>
      <div class="spacer"></div>
      <button class="primary" onclick="openForm()">+ Add product</button>
    </div>

    <!-- add / edit form -->
    <div id="formpanel" class="panel" style="display:none">
      <h3 id="formtitle" style="margin-top:0">Add product</h3>
      <div class="ig">
        <div><label>Game</label>
          <select id="f_game">
            <option>Pokemon</option><option>Riftbound</option><option value="One Piece">One Piece</option><option>Other</option>
          </select></div>
        <div class="wide" style="grid-column:span 2"><label>Product name</label><input id="f_product" placeholder="e.g. Surging Sparks Booster Box"></div>
        <div><label>Type</label>
          <select id="f_category">
            <option>Booster Box</option><option>Elite Trainer Box</option><option>Booster Bundle</option>
            <option>Blister / 3-pack</option><option>Single Pack</option><option>Tin</option>
            <option>Collection Box</option><option>Deck</option><option>Case</option><option>Single Card</option><option>Other</option>
          </select></div>
        <div><label>Quantity</label><input id="f_qty" type="number" min="1" step="1" value="1"></div>
        <div><label>Cost per unit ($)</label><input id="f_cost" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label>Total cost ($)</label><input id="f_total" disabled></div>
        <div><label>Purchase date</label><input id="f_date" type="date"></div>
        <div><label>Payment method</label><input id="f_payment" list="dl_payment" placeholder="Cash, card…"></div>
        <div><label>Bought from</label><input id="f_source" list="dl_source" placeholder="Costco, Distributor…"></div>
        <div><label>Location (where it is)</label><input id="f_location" list="dl_location" placeholder="Home, Machine – 5th St…"></div>
        <div class="wide"><label>Tags (comma-separated)</label><input id="f_tags" placeholder="e.g. restock-soon, japanese, promo"></div>
        <div class="wide"><label>Notes</label><input id="f_notes" placeholder="optional"></div>
      </div>
      <div class="formbar">
        <button onclick="closeForm()">Cancel</button>
        <button class="primary" id="f_save" onclick="submitForm()">Save</button>
      </div>
    </div>

    <!-- filters -->
    <div class="filters" id="filterbar">
      <input id="q" placeholder="Search…" oninput="renderAll()">
      <select id="fl_game" onchange="renderAll()"><option value="">All games</option></select>
      <select id="fl_loc" onchange="renderAll()"><option value="">All locations</option></select>
      <select id="fl_tag" onchange="renderAll()"><option value="">All tags</option></select>
      <select id="fl_channel" onchange="renderAll()" style="display:none"><option value="">All channels</option></select>
      <select id="fl_status" onchange="renderAll()">
        <option value="">Any status</option>
        <option value="stock">In stock</option>
        <option value="soldout">Sold out</option>
      </select>
    </div>

    <div id="view_inv" class="panel"><div class="tblwrap" id="invtbl"></div></div>
    <div id="view_sales" class="panel" style="display:none"><div class="tblwrap" id="salestbl"></div></div>
    <div id="view_stats" style="display:none">
      <div class="tiles" id="stattiles"></div>
      <div class="panel"><div class="subh">By location</div><div class="tblwrap" id="loctbl"></div>
        <div class="subh">By game</div><div class="tblwrap" id="gametbl"></div>
        <div class="subh">By sale channel</div><div class="tblwrap" id="chantbl"></div></div>
    </div>

    <footer>
      <button class="small" onclick="exportJSON()">Export backup</button>
      <button class="small" onclick="document.getElementById('importfile').click()">Import backup</button>
      <input type="file" id="importfile" accept=".json" style="display:none" onchange="importJSON(this)">
      <span class="note" id="revnote"></span>
    </footer>
  </div>
</div>

<!-- sell dialog -->
<dialog id="selldlg">
  <h3 id="selltitle">Record sale</h3>
  <div class="dgrid">
    <div><label>Quantity sold</label><input id="s_qty" type="number" min="1" step="1" value="1"></div>
    <div><label>Sale price per unit ($)</label><input id="s_price" type="number" min="0" step="0.01"></div>
    <div><label>Sale date</label><input id="s_date" type="date"></div>
    <div><label>Channel</label><input id="s_channel" list="dl_channel" placeholder="Machine, eBay…"></div>
    <div><label>Fees ($, total)</label><input id="s_fee" type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div><label>Note</label><input id="s_note" placeholder="optional"></div>
  </div>
  <div class="dfoot">
    <button onclick="document.getElementById('selldlg').close()">Cancel</button>
    <button class="primary" onclick="submitSale()">Save sale</button>
  </div>
</dialog>

<datalist id="dl_payment">
  <option value="Cash"><option value="Credit card"><option value="Debit card">
  <option value="Zelle"><option value="PayPal"><option value="Venmo">
</datalist>
<datalist id="dl_source"></datalist>
<datalist id="dl_channel">
  <option value="Machine"><option value="eBay"><option value="TCGplayer">
  <option value="Local"><option value="Online">
</datalist>
<datalist id="dl_location"></datalist>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const today = () => new Date().toISOString().slice(0, 10);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const GAMES = ['Pokemon', 'Riftbound', 'One Piece', 'Other'];
const gclass = g => 'g-' + (g || 'other').toLowerCase().replace(/[^a-z]/g, '');

// ---------- config + sync ----------
let CFG = null;      // {api, token}
let DOC = {rev: 0, items: []};
let dirty = false, saving = false, saveTimer = null;

function loadCfg() {
  try { CFG = JSON.parse(localStorage.getItem('vt_cfg')); } catch { CFG = null; }
}
function openSettings() {
  $('setup').style.display = '';
  $('app').style.display = 'none';
  if (CFG) { $('cfg_api').value = CFG.api; $('cfg_token').value = CFG.token; }
}
async function saveSettings() {
  const api = $('cfg_api').value.trim().replace(/\/+$/, '');
  const token = $('cfg_token').value.trim();
  if (!api || !token) { alert('Both fields are required.'); return; }
  CFG = {api, token};
  localStorage.setItem('vt_cfg', JSON.stringify(CFG));
  await boot();
}
function setChip(cls, text, retry) {
  const c = $('syncchip');
  c.className = 'chip' + (cls ? ' ' + cls : '');
  c.textContent = text;
  c.onclick = retry ? () => pushNow() : null;
}
async function apiFetch(method, body) {
  const res = await fetch(CFG.api + '/data', {
    method,
    headers: {'Authorization': 'Bearer ' + CFG.token, ...(body ? {'Content-Type': 'application/json'} : {})},
    body: body ? JSON.stringify(body) : undefined,
  });
  return res;
}
async function boot() {
  loadCfg();
  if (!CFG) { openSettings(); return; }
  setChip('busy', 'loading…');
  try {
    const res = await apiFetch('GET');
    if (res.status === 401) { setChip('err', 'bad token'); openSettings(); alert('The server rejected the token. Check Settings.'); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DOC = await res.json();
    if (!Array.isArray(DOC.items)) DOC = {rev: 0, items: []};
  } catch (e) {
    setChip('err', 'offline — retry');
    $('setup').style.display = 'none'; $('app').style.display = '';
    renderAll();
    return;
  }
  setChip('ok', 'synced');
  $('setup').style.display = 'none';
  $('app').style.display = '';
  renderAll();
}
function markDirty() {
  dirty = true;
  setChip('busy', 'saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushNow, 700);
  renderAll();
}
let pending = false;
async function pushNow() {
  if (saving) { pending = true; return; }
  saving = true; pending = false;
  setChip('busy', 'saving…');
  let ok = false;
  try {
    const res = await apiFetch('PUT', {baseRev: DOC.rev, items: DOC.items});
    if (res.status === 409) {
      const j = await res.json();
      DOC = j.doc;
      saving = false; pending = false; dirty = false;
      setChip('ok', 'synced');
      renderAll();
      alert('Another device saved first. This page reloaded the latest data — please redo your last change.');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    DOC.rev = j.rev;
    ok = true;
  } catch (e) {
    setChip('err', 'save failed — tap to retry', true);
  }
  saving = false;
  if (pending) { pushNow(); return; }
  if (ok) { dirty = false; setChip('ok', 'synced'); }
  $('revnote').textContent = 'rev ' + DOC.rev;
}
window.addEventListener('beforeunload', e => {
  if (dirty || saving) { e.preventDefault(); e.returnValue = ''; }
});

// ---------- derived helpers ----------
const soldQty = it => (it.sales || []).reduce((a, s) => a + s.qty, 0);
const remaining = it => it.qty - soldQty(it);
function allSales() {
  const out = [];
  for (const it of DOC.items) for (const s of (it.sales || [])) out.push({it, s});
  out.sort((a, b) => (b.s.date || '').localeCompare(a.s.date || ''));
  return out;
}
function locations() {
  return [...new Set(DOC.items.map(i => i.location).filter(Boolean))].sort();
}
function sources() {
  return [...new Set(DOC.items.map(i => i.source).filter(Boolean))].sort();
}
function allTags() {
  return [...new Set(DOC.items.flatMap(i => i.tags || []))].sort();
}
function channels() {
  const set = new Set(['Machine']);
  for (const it of DOC.items) for (const s of (it.sales || [])) if (s.channel) set.add(s.channel);
  return [...set].sort();
}

// ---------- filters ----------
function passFilter(it) {
  const q = $('q').value.trim().toLowerCase();
  if (q && !((it.product || '') + ' ' + (it.category || '') + ' ' + (it.notes || '') + ' ' + (it.location || '') + ' ' + (it.source || '') + ' ' + (it.tags || []).join(' ')).toLowerCase().includes(q)) return false;
  const g = $('fl_game').value; if (g && it.game !== g) return false;
  const l = $('fl_loc').value; if (l && it.location !== l) return false;
  const t = $('fl_tag').value; if (t && !(it.tags || []).includes(t)) return false;
  const st = $('fl_status').value;
  if (st === 'stock' && remaining(it) <= 0) return false;
  if (st === 'soldout' && remaining(it) > 0) return false;
  return true;
}
function refreshFilterOptions() {
  const keepG = $('fl_game').value, keepL = $('fl_loc').value, keepT = $('fl_tag').value, keepC = $('fl_channel').value;
  $('fl_game').innerHTML = '<option value="">All games</option>' + GAMES.map(g => `<option${g === keepG ? ' selected' : ''}>${g}</option>`).join('');
  $('fl_loc').innerHTML = '<option value="">All locations</option>' + locations().map(l => `<option${l === keepL ? ' selected' : ''}>${esc(l)}</option>`).join('');
  $('fl_tag').innerHTML = '<option value="">All tags</option>' + allTags().map(t => `<option${t === keepT ? ' selected' : ''}>${esc(t)}</option>`).join('');
  $('fl_channel').innerHTML = '<option value="">All channels</option>' + channels().map(c => `<option${c === keepC ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('fl_channel').style.display = TAB === 'sales' ? '' : 'none';
  $('dl_location').innerHTML = locations().map(l => `<option value="${esc(l)}">`).join('');
  $('dl_source').innerHTML = sources().map(s => `<option value="${esc(s)}">`).join('');
}
function setTagFilter(t) { refreshFilterOptions(); $('fl_tag').value = t; renderAll(); }

// ---------- tabs ----------
let TAB = 'inv';
function setTab(t) {
  TAB = t;
  for (const x of ['inv', 'sales', 'stats']) {
    $('tab_' + x).classList.toggle('active', x === t);
    $('view_' + x).style.display = x === t ? '' : 'none';
  }
  $('filterbar').style.display = t === 'stats' ? 'none' : '';
  renderAll();
}

// ---------- rendering ----------
function renderAll() {
  refreshFilterOptions();
  if (TAB === 'inv') renderInventory();
  if (TAB === 'sales') renderSales();
  if (TAB === 'stats') renderStats();
  $('revnote').textContent = 'rev ' + DOC.rev;
}
function renderInventory() {
  const rows = DOC.items.filter(passFilter)
    .sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));
  if (!rows.length) { $('invtbl').innerHTML = '<div class="empty">No products match. Add one with “+ Add product”.</div>'; return; }
  let h = `<table><tr><th>Product</th><th class="num">Qty left</th><th class="num">Unit cost</th><th class="num hidemob">On-hand cost</th><th>Location</th><th class="hidemob">Purchased</th><th class="actions"></th></tr>`;
  for (const it of rows) {
    const rem = remaining(it);
    h += `<tr>
      <td><span class="gchip ${gclass(it.game)}">${esc(it.game)}</span><span class="pname">${esc(it.product)}</span>
        <div class="sub">${esc(it.category || '')}${it.notes ? ' · ' + esc(it.notes) : ''}</div>
        ${(it.tags || []).map(t => `<span class="tag" onclick="setTagFilter(this.textContent)">${esc(t)}</span>`).join('')}</td>
      <td class="num">${rem <= 0 ? '<span class="dim">0</span>' : rem}<span class="dim">/${it.qty}</span></td>
      <td class="num">${money(it.unitCost || 0)}</td>
      <td class="num hidemob">${money(rem * (it.unitCost || 0))}</td>
      <td>${esc(it.location || '')}</td>
      <td class="hidemob"><span class="sub">${esc(it.purchaseDate || '')}${it.payment ? '<br>' + esc(it.payment) : ''}${it.source ? '<br>' + esc(it.source) : ''}</span></td>
      <td class="actions">
        ${rem > 0 ? `<button class="small primary" onclick="openSale('${it.id}')">Sell</button>` : ''}
        <button class="small" onclick="openForm('${it.id}')">Edit</button>
        <button class="small danger" onclick="delItem('${it.id}')">✕</button>
      </td></tr>`;
  }
  $('invtbl').innerHTML = h + '</table>';
}
function renderSales() {
  const ch = $('fl_channel').value;
  const rows = allSales().filter(x => passFilter(x.it) && (!ch || (x.s.channel || '') === ch));
  if (!rows.length) { $('salestbl').innerHTML = '<div class="empty">No sales recorded yet.</div>'; return; }
  let h = `<table><tr><th>Date</th><th>Product</th><th class="hidemob">Channel</th><th class="num">Qty</th><th class="num">Sale/unit</th><th class="num">Revenue</th><th class="num hidemob">Cost</th><th class="num hidemob">Fees</th><th class="num">Profit</th><th class="actions"></th></tr>`;
  let tRev = 0, tCost = 0, tFee = 0;
  for (const {it, s} of rows) {
    const rev = s.qty * s.unitPrice, cost = s.qty * (it.unitCost || 0), fee = s.fee || 0, p = rev - cost - fee;
    tRev += rev; tCost += cost; tFee += fee;
    h += `<tr>
      <td><span class="sub">${esc(s.date || '')}</span></td>
      <td><span class="gchip ${gclass(it.game)}">${esc(it.game)}</span>${esc(it.product)}${s.note ? `<div class="sub">${esc(s.note)}</div>` : ''}</td>
      <td class="hidemob"><span class="sub">${esc(s.channel || '')}</span></td>
      <td class="num">${s.qty}</td>
      <td class="num">${money(s.unitPrice)}</td>
      <td class="num">${money(rev)}</td>
      <td class="num hidemob">${money(cost)}</td>
      <td class="num hidemob">${fee ? money(fee) : '<span class="dim">—</span>'}</td>
      <td class="num ${p >= 0 ? 'good' : 'bad'}">${money(p)}</td>
      <td class="actions"><button class="small danger" onclick="delSale('${it.id}','${s.id}')">✕</button></td></tr>`;
  }
  const tp = tRev - tCost - tFee;
  h += `<tr><td colspan="5" class="dim">Total (filtered)</td><td class="num">${money(tRev)}</td><td class="num hidemob">${money(tCost)}</td><td class="num hidemob">${money(tFee)}</td><td class="num ${tp >= 0 ? 'good' : 'bad'}">${money(tp)}</td><td></td></tr>`;
  $('salestbl').innerHTML = h + '</table>';
}
function renderStats() {
  let unitsOnHand = 0, costOnHand = 0, totalSpent = 0, revenue = 0, costSold = 0, fees = 0;
  const byLoc = {}, byGame = {}, byChan = {};
  for (const it of DOC.items) {
    const rem = remaining(it), uc = it.unitCost || 0;
    unitsOnHand += rem; costOnHand += rem * uc; totalSpent += it.qty * uc;
    const L = byLoc[it.location || '(none)'] ||= {units: 0, cost: 0};
    L.units += rem; L.cost += rem * uc;
    const G = byGame[it.game || 'Other'] ||= {units: 0, cost: 0, rev: 0, profit: 0};
    G.units += rem; G.cost += rem * uc;
    for (const s of (it.sales || [])) {
      const rev = s.qty * s.unitPrice, cost = s.qty * uc, fee = s.fee || 0;
      revenue += rev; costSold += cost; fees += fee;
      G.rev += rev; G.profit += rev - cost - fee;
      const C = byChan[s.channel || '(none)'] ||= {units: 0, rev: 0, fees: 0, profit: 0};
      C.units += s.qty; C.rev += rev; C.fees += fee; C.profit += rev - cost - fee;
    }
  }
  const profit = revenue - costSold - fees;
  const tiles = [
    [money(costOnHand), 'Inventory on hand (at cost)'],
    [unitsOnHand.toLocaleString(), 'Units on hand'],
    [money(revenue), 'Revenue (all time)'],
    [`<span class="${profit >= 0 ? 'good' : 'bad'}">${money(profit)}</span>`, 'Realized profit (after fees)'],
    [revenue > 0 ? (100 * profit / revenue).toFixed(1) + '%' : '—', 'Margin on sales'],
    [money(totalSpent), 'Total ever spent'],
  ];
  $('stattiles').innerHTML = tiles.map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  const locRows = Object.entries(byLoc).filter(([, v]) => v.units > 0).sort((a, b) => b[1].cost - a[1].cost);
  $('loctbl').innerHTML = locRows.length
    ? `<table><tr><th>Location</th><th class="num">Units</th><th class="num">Cost value</th></tr>` +
      locRows.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="num">${v.units}</td><td class="num">${money(v.cost)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">Nothing on hand.</div>';
  $('gametbl').innerHTML = `<table><tr><th>Game</th><th class="num">Units on hand</th><th class="num">Cost value</th><th class="num">Revenue</th><th class="num">Profit</th></tr>` +
    Object.entries(byGame).map(([g, v]) =>
      `<tr><td><span class="gchip ${gclass(g)}">${esc(g)}</span></td><td class="num">${v.units}</td><td class="num">${money(v.cost)}</td><td class="num">${money(v.rev)}</td><td class="num ${v.profit >= 0 ? 'good' : 'bad'}">${money(v.profit)}</td></tr>`).join('') + '</table>';
  const chanRows = Object.entries(byChan).sort((a, b) => b[1].rev - a[1].rev);
  $('chantbl').innerHTML = chanRows.length
    ? `<table><tr><th>Channel</th><th class="num">Units sold</th><th class="num">Revenue</th><th class="num">Fees</th><th class="num">Profit</th></tr>` +
      chanRows.map(([c, v]) => `<tr><td>${esc(c)}</td><td class="num">${v.units}</td><td class="num">${money(v.rev)}</td><td class="num">${money(v.fees)}</td><td class="num ${v.profit >= 0 ? 'good' : 'bad'}">${money(v.profit)}</td></tr>`).join('') + '</table>'
    : '<div class="empty">No sales yet.</div>';
}

// ---------- add / edit ----------
let editId = null;
function openForm(id) {
  editId = id || null;
  $('formpanel').style.display = '';
  $('formtitle').textContent = id ? 'Edit product' : 'Add product';
  const it = id ? DOC.items.find(x => x.id === id) : null;
  $('f_game').value = it?.game || 'Pokemon';
  $('f_product').value = it?.product || '';
  $('f_category').value = it?.category || 'Booster Box';
  $('f_qty').value = it?.qty ?? 1;
  $('f_cost').value = it?.unitCost ?? '';
  $('f_date').value = it?.purchaseDate || today();
  $('f_payment').value = it?.payment || '';
  $('f_source').value = it?.source || '';
  $('f_location').value = it?.location || '';
  $('f_tags').value = (it?.tags || []).join(', ');
  $('f_notes').value = it?.notes || '';
  refreshTotal();
  $('f_product').focus();
  $('formpanel').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function closeForm() { $('formpanel').style.display = 'none'; editId = null; }
function refreshTotal() {
  const t = (+$('f_qty').value || 0) * (+$('f_cost').value || 0);
  $('f_total').value = money(t);
}
$('f_qty').addEventListener('input', refreshTotal);
$('f_cost').addEventListener('input', refreshTotal);
function submitForm() {
  const product = $('f_product').value.trim();
  const qty = Math.max(1, Math.floor(+$('f_qty').value || 0));
  const unitCost = Math.max(0, +$('f_cost').value || 0);
  if (!product) { alert('Product name is required.'); return; }
  const data = {
    game: $('f_game').value, product, category: $('f_category').value,
    qty, unitCost,
    purchaseDate: $('f_date').value || today(),
    payment: $('f_payment').value.trim(),
    source: $('f_source').value.trim(),
    location: $('f_location').value.trim(),
    tags: $('f_tags').value.split(',').map(t => t.trim()).filter(Boolean),
    notes: $('f_notes').value.trim(),
  };
  if (editId) {
    const it = DOC.items.find(x => x.id === editId);
    if (qty < soldQty(it)) { alert(`Quantity can’t be below units already sold (${soldQty(it)}).`); return; }
    Object.assign(it, data);
  } else {
    DOC.items.push({id: uid(), sales: [], createdAt: new Date().toISOString(), ...data});
  }
  closeForm();
  markDirty();
}
function delItem(id) {
  const it = DOC.items.find(x => x.id === id);
  if (!confirm(`Delete "${it.product}" and its ${(it.sales || []).length} sale record(s)? This can’t be undone.`)) return;
  DOC.items = DOC.items.filter(x => x.id !== id);
  markDirty();
}

// ---------- sales ----------
let saleItemId = null;
function openSale(id) {
  saleItemId = id;
  const it = DOC.items.find(x => x.id === id);
  $('selltitle').textContent = `Sell: ${it.product} (${remaining(it)} left)`;
  $('s_qty').value = 1; $('s_qty').max = remaining(it);
  $('s_price').value = ''; $('s_date').value = today(); $('s_note').value = '';
  $('s_channel').value = 'Machine'; $('s_fee').value = '';
  $('selldlg').showModal();
}
function submitSale() {
  const it = DOC.items.find(x => x.id === saleItemId);
  const qty = Math.floor(+$('s_qty').value || 0);
  const price = +$('s_price').value;
  if (qty < 1 || qty > remaining(it)) { alert(`Quantity must be 1–${remaining(it)}.`); return; }
  if (!(price >= 0) || $('s_price').value === '') { alert('Enter the sale price per unit.'); return; }
  (it.sales ||= []).push({
    id: uid(), qty, unitPrice: price,
    date: $('s_date').value || today(),
    channel: $('s_channel').value.trim(),
    fee: Math.max(0, +$('s_fee').value || 0),
    note: $('s_note').value.trim(),
  });
  $('selldlg').close();
  markDirty();
}
function delSale(itemId, saleId) {
  if (!confirm('Delete this sale record? The units go back into inventory.')) return;
  const it = DOC.items.find(x => x.id === itemId);
  it.sales = it.sales.filter(s => s.id !== saleId);
  markDirty();
}

// ---------- backup ----------
function exportJSON() {
  const blob = new Blob([JSON.stringify(DOC, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vending-tracker-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.items)) throw new Error('no items array');
      if (!confirm(`Replace current data (${DOC.items.length} products) with backup (${j.items.length} products)?`)) return;
      DOC.items = j.items;
      markDirty();
    } catch (e) { alert('Not a valid backup file: ' + e.message); }
  };
  r.readAsText(file);
}

window.onload = boot;
</script>
